[package]
name = "whatsapp-desktop-rust"
version = "0.2.2"
description = "Ultra-lightweight, native WhatsApp Desktop alternative built with Rust & Tauri v2"
authors = ["Ryan Prayoga"]
license = "MIT"
repository = "https://github.com/ryan-prayoga/whatsapp-desktop-rust"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
dirs = "5.0"
open = "5.3"
tauri-plugin-updater = "2.11.0"
